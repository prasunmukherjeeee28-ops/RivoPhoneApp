name: Build Liquid Glass APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/build-liquid-glass-apk.yml'
      - 'app/**'
      - 'gradle/**'
      - 'gradle.properties'
      - 'settings.gradle'
      - 'build.gradle'
      - 'gradlew'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build unsigned-debuggable FOSS APK
        run: ./gradlew assembleFossDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Rivo-Liquid-Glass-APK
          path: app/build/outputs/apk/foss/debug/RivoPhone_degoogled-debug.apk
          if-no-files-found: error
          retention-days: 14
